<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sujeeth Sukumar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05080f;
  --text: #e2e8f0;
  --dim: #94a3b8;
  --muted: #4a5568;
  --accent: #3b82f6;
  --accent2: #06b6d4;
  --accent3: #8b5cf6;
  --glass-bg: rgba(255,255,255,0.045);
  --glass-border: rgba(255,255,255,0.10);
  --glass-hover-bg: rgba(255,255,255,0.09);
  --glass-hover-border: rgba(255,255,255,0.24);
  --glass-blur: 28px;
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  --glass-shadow-hover: 0 24px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.15);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  line-height: 1.7;
  overflow-x: hidden;
}

/* CANVAS */
#quantum {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 3rem;
  background: rgba(5,8,15,0.55);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav-logo {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem;
  color: var(--text); text-decoration: none; letter-spacing: -0.02em;
}
.nav-logo em { color: var(--accent2); font-style: normal; }
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a {
  font-family: 'DM Mono', monospace; font-size: 0.7rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--dim); text-decoration: none; transition: color 0.2s;
}
.nav-links a:hover { color: var(--accent2); }

/* LAYOUT */
main {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto; padding: 0 2rem 8rem;
}

/* HERO */
.hero {
  min-height: 100vh; display: flex; flex-direction: column;
  justify-content: center; padding-top: 80px;
}
.hero-sub {
  font-family: 'DM Mono', monospace; font-size: 0.7rem;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent2);
  margin-bottom: 1.4rem; opacity: 0; animation: fadeUp .7s ease .1s forwards;
}
.hero h1 {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: clamp(3rem,8vw,6rem); line-height: .95;
  letter-spacing: -.03em; color: var(--text);
  opacity: 0; animation: fadeUp .7s ease .2s forwards;
}
.hero h1 .grad {
  background: linear-gradient(120deg,var(--accent) 0%,var(--accent2) 60%,var(--accent3) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-desc {
  max-width: 500px; margin-top: 1.8rem; font-size: 1rem; color: var(--dim);
  opacity: 0; animation: fadeUp .7s ease .35s forwards;
}
.hero-cta {
  margin-top: 2.5rem; display: flex; flex-wrap: wrap; gap: .9rem;
