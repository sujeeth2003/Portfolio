<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sujeeth Sukumar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05080f;
  --text: #e2e8f0;
  --dim: #94a3b8;
  --muted: #4a5568;
  --accent: #3b82f6;
  --accent2: #06b6d4;
  --accent3: #8b5cf6;
  --glass-bg: rgba(255,255,255,0.045);
  --glass-border: rgba(255,255,255,0.10);
  --glass-hover-bg: rgba(255,255,255,0.09);
  --glass-hover-border: rgba(255,255,255,0.24);
  --glass-blur: 28px;
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  --glass-shadow-hover: 0 24px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.15);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  line-height: 1.7;
  overflow-x: hidden;
}

/* CANVAS */
#quantum {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 3rem;
  background: rgba(5,8,15,0.55);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav-logo {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem;
  color: var(--text); text-decoration: none; letter-spacing: -0.02em;
}
.nav-logo em { color: var(--accent2); font-style: normal; }
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a {
  font-family: 'DM Mono', monospace; font-size: 0.7rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--dim); text-decoration: none; transition: color 0.2s;
}
.nav-links a:hover { color: var(--accent2); }

/* LAYOUT */
main {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto; padding: 0 2rem 8rem;
}

/* HERO */
.hero {
  min-height: 100vh; display: flex; flex-direction: column;
  justify-content: center; padding-top: 80px;
}
.hero-sub {
  font-family: 'DM Mono', monospace; font-size: 0.7rem;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent2);
  margin-bottom: 1.4rem; opacity: 0; animation: fadeUp .7s ease .1s forwards;
}
.hero h1 {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: clamp(3rem,8vw,6rem); line-height: .95;
  letter-spacing: -.03em; color: var(--text);
  opacity: 0; animation: fadeUp .7s ease .2s forwards;
}
.hero h1 .grad {
  background: linear-gradient(120deg,var(--accent) 0%,var(--accent2) 60%,var(--accent3) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-desc {
  max-width: 500px; margin-top: 1.8rem; font-size: 1rem; color: var(--dim);
  opacity: 0; animation: fadeUp .7s ease .35s forwards;
}
.hero-cta {
  margin-top: 2.5rem; display: flex; flex-wrap: wrap; gap: .9rem;
  opacity: 0; animation: fadeUp .7s ease .5s forwards;
}
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .6rem 1.4rem; border-radius: 100px;
  font-family: 'DM Mono', monospace; font-size: .72rem;
  letter-spacing: .08em; text-decoration: none; border: none; cursor: pointer; transition: all .2s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #2563eb; box-shadow: 0 0 28px rgba(59,130,246,.45); transform: translateY(-1px); }
.btn-ghost {
  background: rgba(255,255,255,.04); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.1); color: var(--dim);
}
.btn-ghost:hover { border-color: rgba(255,255,255,.25); color: var(--text); transform: translateY(-1px); }
.scroll-hint {
  margin-top: 4rem; font-family: 'DM Mono', monospace;
  font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: .8rem;
  opacity: 0; animation: fadeUp .7s ease .7s forwards;
}
.scroll-hint::before { content: ''; display: block; width: 28px; height: 1px; background: var(--muted); }

/* SECTION */
section { padding: 6rem 0 1rem; }
.sec-eyebrow {
  font-family: 'DM Mono', monospace; font-size: .65rem;
  letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: .5rem;
}
h2 {
  font-family: 'Syne', sans-serif; font-weight: 700;
  font-size: clamp(1.7rem,3.5vw,2.5rem); letter-spacing: -.025em;
  color: var(--text); margin-bottom: 2.5rem;
}

/* GLASS BASE */
.glass-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--glass-shadow);
  position: relative; overflow: hidden;
  transition: background .35s, border-color .35s, box-shadow .35s, transform .35s;
}
/* Apple sheen — top highlight line + diagonal highlight */
.glass-card::before {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(160deg,
      rgba(255,255,255,0.10) 0%,
      rgba(255,255,255,0.03) 30%,
      transparent 60%);
  border-radius: inherit; pointer-events: none;
  opacity: 0; transition: opacity .35s;
}
.glass-card:hover::before { opacity: 1; }
.glass-card:hover {
  background: var(--glass-hover-bg);
  border-color: var(--glass-hover-border);
  box-shadow: var(--glass-shadow-hover);
}

/* ── EXPERIENCE ── */
.exp-list { display: flex; flex-direction: column; gap: 1rem; }
.exp-card { padding: 1.6rem 1.8rem; cursor: pointer; }
.exp-card:hover { transform: translateY(-2px); }
.exp-card.open { transform: none; }
.exp-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.exp-role {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
  color: var(--text); margin-bottom: .2rem;
}
.exp-meta { font-family: 'DM Mono', monospace; font-size: .72rem; color: var(--accent2); letter-spacing: .05em; }
.exp-toggle {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--dim); font-size: .9rem;
  transition: background .2s, transform .35s cubic-bezier(.4,0,.2,1);
}
.exp-card.open .exp-toggle { transform: rotate(45deg); background: rgba(59,130,246,.2); color: var(--accent); }
.exp-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.4,0,.2,1); }
.exp-card.open .exp-body { grid-template-rows: 1fr; }
.exp-body-inner { overflow: hidden; }
.exp-body-content { padding-top: 1.4rem; }
.exp-sec-label {
  font-family: 'DM Mono', monospace; font-size: .63rem;
  letter-spacing: .14em; text-transform: uppercase; color: var(--accent3);
  margin: 1.2rem 0 .5rem;
}
.exp-sec-label:first-child { margin-top: 0; }
.exp-bullets { list-style: none; display: flex; flex-direction: column; gap: .5rem; }
.exp-bullets li {
  font-size: .875rem; color: var(--dim); padding-left: 1.2rem;
  position: relative; line-height: 1.55;
}
.exp-bullets li::before {
  content: '▸'; position: absolute; left: 0;
  color: var(--accent); font-size: .65rem; top: .25rem;
}
.exp-bullets strong { color: var(--text); font-weight: 500; }

/* ── PROJECTS ── */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 1rem; align-items: start;
}
.proj-card { padding: 1.5rem; cursor: pointer; }
.proj-card:hover { transform: translateY(-3px); }
.proj-card.open { transform: none; }
/* accent glow in top-right */
.proj-glow {
  position: absolute; top: -50px; right: -50px;
  width: 130px; height: 130px; border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,.2) 0%, transparent 70%);
  pointer-events: none; opacity: 0; transition: opacity .4s;
}
.proj-card:hover .proj-glow,
.proj-card.open  .proj-glow { opacity: 1; }
.proj-year { font-family: 'DM Mono', monospace; font-size: .63rem; color: var(--muted); letter-spacing: .1em; margin-bottom: .5rem; display: flex; align-items: center; gap: .5rem; }
.proj-status {
  font-family: 'DM Mono', monospace; font-size: .58rem; letter-spacing: .08em;
  padding: .1rem .45rem; border-radius: 3px;
  background: rgba(139,92,246,.14); border: 1px solid rgba(139,92,246,.3); color: var(--accent3);
}
.proj-link {
  display: inline-flex; align-items: center; gap: .35rem;
  font-family: 'DM Mono', monospace; font-size: .68rem; color: var(--accent2);
  text-decoration: none; margin-top: .9rem;
}
.proj-link:hover { color: var(--text); }
.proj-link-soon {
  display: inline-block; font-family: 'DM Mono', monospace; font-size: .65rem;
  color: var(--muted); margin-top: .9rem; letter-spacing: .04em;
}
.proj-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: .95rem; color: var(--text); margin-bottom: .5rem; line-height: 1.25; }
.proj-teaser { font-size: .82rem; color: var(--dim); line-height: 1.5; margin-bottom: .9rem; }
.proj-tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.tag {
  font-family: 'DM Mono', monospace; font-size: .6rem;
  padding: .18rem .5rem; border-radius: 4px;
  background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.22); color: var(--accent2);
}
/* expand */
.proj-expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.4,0,.2,1); }
.proj-card.open .proj-expand { grid-template-rows: 1fr; }
.proj-expand-inner { overflow: hidden; }
.proj-expand-content {
  padding-top: 1rem; margin-top: 1rem;
  border-top: 1px solid rgba(255,255,255,.08);
}
.proj-bullets { list-style: none; display: flex; flex-direction: column; gap: .45rem; }
.proj-bullets li {
  font-size: .81rem; color: var(--dim); padding-left: 1.1rem;
  position: relative; line-height: 1.5;
}
.proj-bullets li::before {
  content: '▸'; position: absolute; left: 0;
  color: var(--accent2); font-size: .6rem; top: .22rem;
}
.proj-bullets strong { color: var(--text); font-weight: 500; }
.proj-hint {
  font-family: 'DM Mono', monospace; font-size: .6rem;
  color: var(--muted); letter-spacing: .1em; text-align: right; margin-top: .9rem;
  transition: color .2s;
}
.proj-card:hover .proj-hint { color: var(--accent2); }
.proj-card.open .proj-hint { display: none; }

/* SKILLS */
.skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 1rem; }
.skill-block { padding: 1.2rem 1.4rem; }
.skill-label { font-family: 'DM Mono', monospace; font-size: .63rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: .5rem; }
.skill-items { font-size: .85rem; color: var(--dim); line-height: 1.65; }

/* EDUCATION */
.edu-list { display: flex; flex-direction: column; gap: 1rem; }
.edu-card {
  padding: 1.4rem 1.6rem; display: flex;
  justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: .5rem;
}
.edu-school { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); }
.edu-degree { font-size: .85rem; color: var(--dim); margin-top: .2rem; }
.edu-meta { text-align: right; font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--accent2); line-height: 1.6; }
