<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>Sujeeth Sukumar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sujeeth Sukumar - low-latency systems, RTL, quantitative trading, applied ML, and data engineering.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@400;500&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
<style>
:root{
  --bg:#eef3f9;
  --bg-raise:#ffffff;
  --text:#182233;
  --dim:#4a5670;
  --muted:#71809c;
  --line:rgba(24,34,51,0.12);
  --line-strong:rgba(24,34,51,0.22);
  --card:rgba(255,255,255,0.76);
  --card-hover:rgba(255,255,255,0.9);
  --radius:14px;

  --accent:#2f6fa8;
  --accent-soft:rgba(47,111,168,.14);
  --accent-dim:rgba(47,111,168,.5);

  --f-systems:#2f6fa8;
  --f-hardware:#5a5fbf;
  --f-quant:#2f9e86;
  --f-ml:#8354c2;
  --f-data:#526a94;

  --deck-radius:1;
}
@media (max-width:900px){:root{--deck-radius:.62}}
@media (max-width:560px){:root{--deck-radius:.4}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;font-weight:300;line-height:1.7;
  overflow-x:hidden;
}
/* site-wide background photo, fixed so it stays put while panels scroll over it -
   kept at a modest size and padded with a matching board-blue so it reads as a
   framed illustration instead of an oversized, text-obscuring backdrop */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;background-color:#b7c7db;
  background-image:url('assets/hero-bg.jpg');
  background-repeat:no-repeat;background-position:center;background-attachment:fixed;
  background-size:Cover;
}
@media (max-width: 768px) { body::before { background-attachment: scroll;}}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(238,243,249,.38),rgba(238,243,249,.62) 35%,rgba(238,243,249,.8));
}
::selection{background:rgba(47,111,168,.28);color:#fff}

/* progress rail — fills as you scroll through the fields, left edge only */
.progress-rail{position:fixed;top:68px;left:0;width:3px;height:calc(100% - 68px);z-index:150;background:var(--line);pointer-events:none}
.progress-rail-fill{width:100%;height:0%;background:var(--accent);transition:height .1s linear}

/* mascot — live2d widget renders its own canvas bottom-right; this is just the speech bubble */
.mascot-bubble{
  position:fixed;right:8.8rem;bottom:16.5rem;z-index:180;max-width:150px;
  padding:.5rem .7rem;border-radius:10px 2px 10px 10px;
  background:var(--bg-raise);border:1px solid var(--line-strong);
  font-family:'Inter',sans-serif;font-size:.7rem;color:var(--text);line-height:1.4;
  opacity:0;transform:translateY(6px) scale(.96);transition:opacity .3s,transform .3s;
  pointer-events:none;
}
.mascot-bubble.show{opacity:1;transform:none}
@media (max-width:640px){.mascot-bubble{right:6.4rem;bottom:11rem;max-width:120px;font-size:.65rem;padding:.45rem .6rem}}

a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 2rem}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;height:68px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;background:rgba(255,255,255,.62);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.nav-logo{font-family:'Zen Kaku Gothic New', sans-serif;font-weight:800;font-size:1rem;text-decoration:none;letter-spacing:-.02em}
.nav-logo em{color:var(--accent);font-style:normal}
.nav-links{display:flex;gap:1.6rem;list-style:none}
.nav-links a{
  font-family:'JetBrains Mono', monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;color:var(--dim);transition:color .2s;white-space:nowrap;
}
.nav-links a:hover{color:var(--text)}
.nav-toggle{display:none}
@media (max-width:860px){
  .nav-links{display:none}
}

main{position:relative;z-index:1}

/* HERO */
.hero{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:6rem 2rem 3rem;max-width:1120px;margin:0 auto;
}
.hero-eyebrow{
  font-family:'JetBrains Mono', monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin-bottom:1.3rem;text-shadow:0 1px 12px rgba(238,243,249,.9),0 1px 2px rgba(238,243,249,.9);
  opacity:0;animation:fadeUp .7s ease .1s forwards;
}
.hero h1{
  font-family:'Zen Kaku Gothic New', sans-serif;font-weight:800;font-size:clamp(2.4rem,5.4vw,4rem);
  line-height:1.08;letter-spacing:-.03em;max-width:17ch;text-shadow:0 2px 24px rgba(238,243,249,.85);
  opacity:0;animation:fadeUp .7s ease .2s forwards;
}
.hero-desc{
  max-width:56ch;margin-top:1.6rem;font-size:1.05rem;color:var(--dim);text-shadow:0 1px 16px rgba(238,243,249,.9);
  opacity:0;animation:fadeUp .7s ease .35s forwards;
}
.hero-fields{
  margin-top:2.2rem;display:flex;flex-wrap:wrap;gap:.6rem;
  opacity:0;animation:fadeUp .7s ease .48s forwards;
}
.field-pill{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:'JetBrains Mono', monospace;font-size:.72rem;letter-spacing:.03em;
  padding:.55rem 1rem;border-radius:100px;border:1px solid var(--line);
  text-decoration:none;color:var(--text);background:rgba(255,255,255,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:border-color .2s,transform .2s,background .2s;
}
.field-pill:hover{transform:translateY(-2px)}
.field-pill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.yt-thumb{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0}
.hero-cta{
  margin-top:2.2rem;display:flex;flex-wrap:wrap;gap:.8rem;
  opacity:0;animation:fadeUp .7s ease .6s forwards;
}
.btn{
  display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.35rem;border-radius:100px;
  font-family:'JetBrains Mono', monospace;font-size:.72rem;letter-spacing:.05em;
  text-decoration:none;border:1px solid var(--line);cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(24,34,51,.18)}
.btn-ghost{background:rgba(255,255,255,.55);color:var(--dim);backdrop-filter:blur(6px)}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--text);transform:translateY(-1px)}

/* SECTION SHELL */
.field-section{
  padding:5.5rem 0 1rem;border-top:1px solid var(--line);position:relative;
  background:linear-gradient(180deg,color-mix(in srgb,var(--f) 12%,transparent),transparent 55%);
}

/* field detail panels - hidden until picked from the orbit selector */
.field-detail{display:none}
.field-detail.open{display:block;animation:fieldFadeIn .5s ease}
@keyframes fieldFadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* deck selector - rectangular cards circling a center point, one up front at a time */
#explore{transition:opacity .4s,max-height .4s;overflow:hidden}
#explore.collapsed{max-height:0;opacity:0;padding:0;border-top:none;pointer-events:none}
.back-to-explore{
  display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1.2rem;
  font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.04em;
  padding:.5rem .9rem;border-radius:100px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.6);backdrop-filter:blur(6px);color:var(--dim);
  cursor:pointer;transition:transform .2s,color .2s,border-color .2s;
}
.back-to-explore:hover{transform:translateX(-2px);color:var(--text);border-color:var(--f,var(--accent))}
.deck-wrap{position:relative;height:210px;margin:0 auto 1rem;perspective:900px}
.deck-card{
  position:absolute;top:50%;left:50%;width:220px;height:145px;
  border-radius:14px;overflow:hidden;border:2px solid var(--f);cursor:pointer;padding:0;
  background:var(--bg-raise);box-shadow:0 14px 34px rgba(24,34,51,.2);
  transition:transform .7s cubic-bezier(.4,0,.2,1),opacity .7s,box-shadow .3s;
}
.deck-card:hover{box-shadow:0 18px 40px rgba(24,34,51,.3)}
.deck-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.deck-card-body{
  position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  padding:.85rem .95rem;text-align:left;
  background:linear-gradient(180deg,transparent 30%,rgba(255,255,255,.92) 62%);
}
.deck-card-title{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:.92rem;color:var(--text)}
.deck-card-desc{font-size:.72rem;color:var(--dim);margin-top:.25rem;line-height:1.35}
.deck-card.front{border-width:3px}
@media (max-width:640px){
  .deck-wrap{height:170px}
  .deck-card{width:170px;height:112px}
  .deck-card-title{font-size:.82rem}
  .deck-card-desc{font-size:.66rem}
}
/* PCB scene overlay - hardware section only, sits atop the shared background photo */
.circuit-bg .pcb-scene{
  position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 80%,transparent);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 80%,transparent);
}
.circuit-bg .pcb-scene svg{position:absolute;top:0;left:50%;transform:translateX(-50%);width:1400px;max-width:none;height:100%;opacity:.3}
.circuit-bg>.wrap{position:relative;z-index:1}
.field-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;
  margin-bottom:2.6rem;
}
.field-eyebrow{
  font-family:'JetBrains Mono', monospace;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  margin-bottom:.6rem;
}
.field-title{font-family:'Zen Kaku Gothic New', sans-serif;font-weight:700;font-size:clamp(1.6rem,3.2vw,2.3rem);letter-spacing:-.02em;text-shadow:0 2px 20px rgba(238,243,249,.85)}
.field-note{max-width:34ch;font-size:.88rem;color:var(--dim);text-align:right;text-shadow:0 1px 14px rgba(238,243,249,.85)}
.field-eyebrow{text-shadow:0 1px 12px rgba(238,243,249,.85)}
@media (max-width:700px){.field-note{text-align:left;max-width:none}}

/* card base — glass, so the background photo still reads through */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 8px 30px rgba(24,34,51,.08);
  transition:background .3s,border-color .3s,transform .3s;position:relative;overflow:hidden;
}
.card:hover{background:var(--card-hover)}

/* FLAGSHIP */
.flagship{
  display:grid;grid-template-columns:1.15fr .85fr;gap:0;padding:2.4rem;margin-bottom:1rem;
  border-color:color-mix(in srgb,var(--f,var(--accent)) 30%,var(--line)) !important;
}
.flagship .flag-badge{
  display:inline-flex;align-items:center;gap:.5rem;font-family:'JetBrains Mono', monospace;
  font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .7rem;
  border-radius:100px;border:1px solid color-mix(in srgb,var(--f,var(--accent)) 45%,transparent);
  color:var(--f,var(--accent));margin-bottom:1.1rem;
}
.flagship h3{font-family:'Zen Kaku Gothic New', sans-serif;font-weight:700;font-size:clamp(1.3rem,2.4vw,1.7rem);letter-spacing:-.01em;margin-bottom:.9rem;line-height:1.2}
.flagship p.lede{font-size:.92rem;color:var(--dim);margin-bottom:1.3rem;max-width:52ch}
.flag-stats{display:flex;flex-wrap:wrap;gap:1.6rem;margin-bottom:1.4rem}
.flag-stat b{display:block;font-family:'Zen Kaku Gothic New', sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.flag-stat span{font-family:'JetBrains Mono', monospace;font-size:.63rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.flag-bullets{list-style:none;display:flex;flex-direction:column;gap:.55rem;margin-bottom:1.4rem}
.flag-bullets li{font-size:.85rem;color:var(--dim);padding-left:1.15rem;position:relative;line-height:1.55}
.flag-bullets li::before{content:'';position:absolute;left:0;top:.55rem;width:5px;height:5px;border-radius:50%;background:var(--f,var(--f-systems))}
.flag-bullets strong{color:var(--text);font-weight:500}
.flag-side{
  border-left:1px solid var(--line);padding-left:2.2rem;display:flex;flex-direction:column;
  justify-content:space-between;gap:1.4rem;
}
.flag-side .stack-label{font-family:'JetBrains Mono', monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.flag-stack{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{font-family:'JetBrains Mono', monospace;font-size:.6rem;padding:.22rem .55rem;border-radius:5px;border:1px solid var(--line)}
.flag-link{
  display:inline-flex;align-items:center;gap:.4rem;font-family:'JetBrains Mono', monospace;font-size:.72rem;
  text-decoration:none;padding:.65rem 1.2rem;border-radius:100px;
  border:1px solid color-mix(in srgb,var(--f,var(--accent)) 45%,transparent);color:var(--f,var(--accent));
  align-self:flex-start;transition:transform .2s,background .2s;
}
.flag-link:hover{transform:translateY(-1px)}
@media (max-width:820px){
  .flagship{grid-template-columns:1fr;padding:1.6rem}
  .flag-side{border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:1.4rem;margin-top:.4rem}
}
