name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Rem model URL from secret
        env:
          REM_MODEL_URL: ${{ secrets.REM_MODEL_URL }}
        run: |
          if [ -z "$REM_MODEL_URL" ]; then
            echo "::error::REM_MODEL_URL secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          sed -i "s#__REM_MODEL_URL__#${REM_MODEL_URL//#/\\#}#g" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
